# Debug APK for on-device testing (arm64, tawcroot, libhybris + cpu graphics).
# Mirrors the F-Droid recipe (fdroid/me.phie.tawc.yml): Debian trixie, same host
# packages, NDK and Rust pins. Builds the debug variant so the exec broker is included.
name: build-apk

on:
  push:
  workflow_dispatch:
    inputs:
      tawcroot_diagnostics:
        description: Run canonical baseline/trace tests and upload an unpackaged ARM64 trace binary
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/pocket/tawcroot-sigsys-diagnostics') || (github.event_name == 'workflow_dispatch' && inputs.tawcroot_diagnostics)) && 75 || 240 }}
    container:
      image: debian:trixie
      # The runner's own preinstalled SDKs are unused here; mounted only so they can be deleted
      # to free disk for the NDK, Rust targets and the Xwayland/libhybris cross-builds.
      options: -v /usr/share/dotnet:/host/dotnet -v /usr/local/lib/android:/host/android -v /opt/hostedtoolcache:/host/toolcache
    defaults:
      run:
        shell: bash
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      NDK_VERSION: 27.2.12479018
      CMDLINE_TOOLS_ZIP: commandlinetools-linux-13114758_latest.zip
      CARGO_TERM_COLOR: always
      # SHA-256 of the certificate in DEBUG_KEYSTORE_B64; builds signed with anything
      # else can't install over earlier ones, so the Checksum step enforces it.
      DEBUG_CERT_SHA256: 1d023213c6fa11f51455508f595ddbd80a906d761e85dc9f21738c017d911afd
    steps:
      - name: Free runner disk
        run: |
          rm -rf /host/dotnet/* /host/android/* /host/toolcache/* || true
          df -h /

      - name: Host packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates unzip openjdk-21-jdk-headless \
            rustup \
            build-essential make pkg-config curl libarchive-tools file \
            meson ninja-build bison \
            autoconf automake libtool libtool-bin libltdl-dev \
            perl python3 python3-libxml2 xsltproc libexpat1-dev \
            libwayland-dev libwayland-bin libwayland-egl-backend-dev \
            wayland-protocols \
            libvulkan-dev patchelf \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu libc6-arm64-cross \
            linux-libc-dev-arm64-cross

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Mark checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore cargo, gradle and vendored deps
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.rustup
            ~/.gradle/caches
            ~/.gradle/wrapper
            deps
          key: tawc-${{ hashFiles('rust-toolchain.toml', 'deps/deps.list', '**/Cargo.lock', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: tawc-

      - name: Android SDK + NDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip "https://dl.google.com/android/repository/$CMDLINE_TOOLS_ZIP"
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          # `yes` dies of SIGPIPE once sdkmanager stops reading; fine under pipefail.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Rust toolchain + cargo-ndk
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain || rustup toolchain install
          command -v cargo-ndk || cargo install cargo-ndk --version 4.1.2 --locked

      - name: Canonical tawcroot regressions (opt-in diagnostics)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/pocket/tawcroot-sigsys-diagnostics') || (github.event_name == 'workflow_dispatch' && inputs.tawcroot_diagnostics)
        timeout-minutes: 45
        run: bash scripts/ci/tawcroot-diagnostics.sh host-tests

      - name: Gate canonical regression evidence
        id: host_privacy
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/pocket/tawcroot-sigsys-diagnostics') || (github.event_name == 'workflow_dispatch' && inputs.tawcroot_diagnostics))
        timeout-minutes: 3
        run: python3 scripts/ci/check-public-artifacts.py host

      - name: Upload canonical regression evidence
        if: always() && steps.host_privacy.conclusion == 'success' && steps.host_privacy.outputs.approved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tawcroot-host-regressions-${{ github.sha }}
          path: ${{ steps.host_privacy.outputs.paths }}
          retention-days: 7

      - name: Debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          # Keep signing material out of shell tracing and readable only by this job.
          set +x
          umask 077
          # A fixed key lets successive builds install over each other without
          # uninstalling (which would delete the installed distros).
          # The container runs as root with HOME=/github/home, but Java's user.home
          # is /root, and AGP falls back to a fresh random key there. Put the key in
          # both places and point ANDROID_USER_HOME at it.
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            for d in "$HOME/.android" /root/.android; do
              mkdir -p "$d"
              printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$d/debug.keystore"
              chmod 600 "$d/debug.keystore"
            done
            echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 not set; using a throwaway debug key"
          fi

      - name: Build debug APK
        run: |
          mkdir -p build/pocket-tawcroot-diagnostics/apk
          ulimit -c 0
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          ./gradlew --no-daemon --stacktrace assembleDebug \
            -PtawcAbis=arm64-v8a -PtawcXwayland=true \
            -PtawcGraphics=libhybris,cpu -PtawcMethods=tawcroot \
            -PtawcBootstrapPackages=false \
            > build/pocket-tawcroot-diagnostics/apk/build.log 2>&1

      # Saved right after a good build, so a later step failing doesn't lose it.
      - name: Save cargo, gradle and vendored deps
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.rustup
            ~/.gradle/caches
            ~/.gradle/wrapper
            deps
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Checksum
        id: checksum
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/pocket-tawcroot-diagnostics/apk"
          {
            cd app/build/outputs/apk/debug
            apk="tawc-debug-${GITHUB_SHA::7}.apk"
            mv app-debug.apk "$apk"
            sha256sum "$apk" | tee SHA256SUMS
            echo "TAWC_APK=$apk" >> "$GITHUB_ENV"
            signer=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            echo "signer: $signer"
            if [ -n "$DEBUG_CERT_SHA256" ] && [ "$signer" != "$DEBUG_CERT_SHA256" ]; then
              echo "::error::APK signed with $signer, expected $DEBUG_CERT_SHA256"
              exit 1
            fi
            df -h /
          } > "$GITHUB_WORKSPACE/build/pocket-tawcroot-diagnostics/apk/signing-check.log" 2>&1

      # Captured test failures do not publish raw output; the gate can still approve the APK.
      - name: Unit tests (fork changes)
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest \
            --tests 'me.phie.tawc.install.RootfsAutostartTest' \
            -PtawcAbis=arm64-v8a -PtawcXwayland=true \
            -PtawcGraphics=libhybris,cpu -PtawcMethods=tawcroot \
            -PtawcBootstrapPackages=false \
            > build/pocket-tawcroot-diagnostics/apk/unit-tests.log 2>&1

      - name: Remove restored signing material
        if: always()
        run: |
          set +x
          rm -f "$HOME/.android/debug.keystore" /root/.android/debug.keystore

      - name: Gate APK and captured build evidence
        id: apk_privacy
        if: always() && steps.checksum.conclusion == 'success'
        timeout-minutes: 3
        run: python3 scripts/ci/check-public-artifacts.py apk

      - name: Upload approved APK and build evidence
        if: always() && steps.apk_privacy.conclusion == 'success' && steps.apk_privacy.outputs.approved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tawc-debug-${{ github.sha }}
          path: ${{ steps.apk_privacy.outputs.paths }}
          retention-days: 30

      # Built after the ordinary APK is uploaded; --no-stage leaves its JNI input unchanged.
      - name: Build standalone trace runtime (opt-in diagnostics)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/pocket/tawcroot-sigsys-diagnostics') || (github.event_name == 'workflow_dispatch' && inputs.tawcroot_diagnostics)
        timeout-minutes: 12
        run: bash scripts/ci/tawcroot-diagnostics.sh arm64-artifact

      - name: Gate standalone diagnostic evidence
        id: arm64_privacy
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/pocket/tawcroot-sigsys-diagnostics') || (github.event_name == 'workflow_dispatch' && inputs.tawcroot_diagnostics))
        timeout-minutes: 3
        run: python3 scripts/ci/check-public-artifacts.py arm64

      - name: Upload standalone diagnostic evidence
        if: always() && steps.arm64_privacy.conclusion == 'success' && steps.arm64_privacy.outputs.approved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tawcroot-arm64-trace-${{ github.sha }}
          path: ${{ steps.arm64_privacy.outputs.paths }}
          retention-days: 7
